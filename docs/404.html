<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found · AI4ME Resource Hub</title>
  <meta name="description" content="This page could not be found. Return to the AI4ME Resource Hub." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F2EEE6;
      --ink: #15140F;
      --ink-2: #3B372E;
      --accent: oklch(0.60 0.14 35);
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 650px at 88% 50%, oklch(0.60 0.14 35 / 0.15), transparent 70%),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: min(760px, 100%);
      border: 1px solid rgba(21,20,15,0.14);
      background: rgba(242,238,230,0.9);
      backdrop-filter: blur(2px);
      border-radius: 14px;
      padding: 42px 34px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 14px;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(36px, 7vw, 68px);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.01em;
    }
    h1 em { color: var(--accent); font-style: italic; }
    p {
      margin: 18px 0 30px;
      color: var(--ink-2);
      font-size: 18px;
      line-height: 1.5;
      max-width: 56ch;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--ink);
      color: var(--paper);
    }
    .btn-primary:hover { background: #26241c; }
    .btn-soft {
      border-color: rgba(21,20,15,0.14);
      color: var(--ink);
      background: transparent;
    }
    .btn-soft:hover { background: rgba(21,20,15,0.04); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">404 · Not Found</p>
    <h1>This page went <em>off course.</em></h1>
    <p>The page you requested does not exist at this address. Use the hub link below to continue browsing AI4ME resources and presentations.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./index.html">Go To Hub</a>
      <a class="btn btn-soft" href="./presentations/agentic-ai-discussion.html">Open Featured Presentation</a>
    </div>
  </main>
</body>
</html>
